# Runs exactly the test files that pass from a clean copy of this repository -- nothing else.
#
# Why a fixed list rather than "run everything": 22 of the 72 published test files do not pass from a clean
# copy, almost all because the data they read is withheld (the point-in-time price store, the factor store,
# the parity fixtures) or because a path to the author's machine was replaced by a placeholder. One more,
# tools/test-delegate.py, passes only where a local language model is running, so it is not listed.
# Running any of them here would fail for a reason that has nothing to do with the code, and a red badge
# that everyone learns to ignore is worse than no badge. The failing files are listed in docs/audit.md with
# their causes; none of them is excluded by loosening a test.
#
# The list is .github/ci-suites.txt, and `python tools/run-ci-suites.py` runs it locally exactly as here.
# No secrets and a read-only token. The only network access is installing requirements.txt. Two suites
# exercise a market-data client; they mock the fetch, so the job does not call a market-data service.

name: Tests that pass from a clean copy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: Run the clean-copy suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run the suites listed in .github/ci-suites.txt
        run: python tools/run-ci-suites.py

  commit-messages:
    name: Commit messages carry no tool footers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Check every commit on the pull-request branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%h %s%n%b' "origin/${BASE_REF}..${HEAD_SHA}" \
            | grep -iE '^co-authored-by:.*claude|^claude-session:|generated with \[?claude code' || true)
          if [ -n "$bad" ]; then
            echo "These commit-message lines are tool footers; remove them:"
            echo "$bad"
            exit 1
          fi
          echo "No tool footers in $(git rev-list --count "origin/${BASE_REF}..${HEAD_SHA}") commit(s)."
