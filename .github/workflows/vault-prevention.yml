# DORMANT BY DESIGN (TENFOLD T7, 2026-07-04): this vault is local-only -- no git remote is
# configured, so GitHub Actions never fires and this workflow has never run. Kept (not deleted)
# because it activates automatically if a remote + Actions are ever added (e.g. osanwe-public).
# Before relying on it, re-verify the harness + audit-floor steps still match tools/.
name: Vault Prevention Architecture
# PUBLICATION CHANGE (audit, 2026-09-21): in the working system this workflow is dormant because that
# copy has no git remote. Published into a repository with Actions enabled it would start firing, and its
# steps target the working vault's data, so it would fail for reasons unrelated to this code. Its triggers
# are therefore reduced to manual dispatch here. The steps below are unchanged. The suites that DO pass
# from a clean copy run in tests.yml.
on:
  workflow_dispatch:

jobs:
  test-harness:
    name: Run prevention-architecture test harness + audit floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test harness (15+ tests)
        run: bash tools/test-prevention-arch.sh

      - name: Vault audit (assert score >= 95-floor)
        run: |
          python tools/vault-audit.py --json | python -c "
          import sys, json
          d = json.load(sys.stdin)
          score = d['score']
          gate = d.get('tiers', {}).get('gate', {}).get('count', 0)
          assert gate == 0, f'GATE breach: {gate} findings; vault must be GATE-clean for merge'
          assert score >= 95, f'Score {score} below 95-floor invariant; refactor before merge'
          print(f'Vault audit PASS: score {score}/100, GATE clean')
          "
