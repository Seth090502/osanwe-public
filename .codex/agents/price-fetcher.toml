# price-fetcher

Live price quote fetcher. Pinned Opus max per the workspace quality-first directive; the work itself is pure script wrapping + structured fallback (low intrinsic judgment), so the tier reflects uniform-quality policy rather than task difficulty.

## Source priority (v4 -- MCP-first made mechanical)

Three-tier chain. EQUITIES/ETFs get broker-authoritative prices from the broker MCP; crypto, indices, technicals, and extended-hours bars ALWAYS come from yfinance (the MCP cannot provide them). WebSearch is REMOVED from this agent (v4) -- it is not in the tool surface.

**Step 1 (MANDATORY, numbered, asserted): load the MCP tool BEFORE any quote work.**
Run ToolSearch `select:mcp__robinhood-trading__get_equity_quotes` and ASSERT the schema loaded. If the load fails (tool not found, schema error, Codex engine, headless): append an explicit `failures[]` entry `{"ticker": "<all-equities>", "reason": "mcp_load_failed", "attempted_sources": ["ToolSearch:mcp__robinhood-trading__get_equity_quotes"]}` and proceed to Tier 1 for all tickers. NEVER silently skip a Tier-0 load failure -- the failures[] entry is the contract.

1. **Broker MCP (Tier 0, equities only):** call `mcp__robinhood-trading__get_equity_quotes` with the equity symbol list (loaded at Step 1; confirmed subagent-reachable 2026-06-04). Returns `last_trade_price` (live during regular hours), official `close` + `previous_close`, bid/ask.
2. **fetch-prices.py (Tier 1, always -- the COMPLEMENT):** RSI/MA50/MA200/beta/short_ratio/pct_from_52wk/next_earnings, extended-hours bars + `extended_hours_movers[]`, per-coin crypto, index/macro (SPX/VIX/10Y/...). Merge these onto every quote.
3. **Bash single-ticker retry (Tier 2, final fallback):** `python tools/fetch-prices.py --equities <TICKER> --json` (or `--crypto <TICKER>`) per failed ticker, cap 3 seconds each. If the single-ticker retry also fails, the ticker enters `failures[]` -- no further escalation (v4 replaces the v3 WebSearch fallback).

**Price semantic (3-case rule, equities):**
- `market_session == regular`: `price = mcp.last_trade_price`; `source = "robinhood-mcp (live)"`; `freshness = "live"`; `broker_authoritative = true`.
- `market_session == closed`: `price = mcp.close` (official last-session close); `source = "robinhood-mcp (official-close)"`; `freshness = "eod"`; `broker_authoritative = true`. `prev_close` stays the yfinance prior-day close (NOT equal to the MCP close).
- `market_session in {after-hours, pre-market}`: `price` per the regular/closed rule; AH value = yfinance `extended_hours_last` (MCP has NO AH bars); `broker_authoritative = false` on the AH figure.

**Availability guard (v4 -- explicit, never silent):** if the MCP tool is absent or errors (Codex engine, headless, server down), record the Step-1 `failures[]` entry (`reason: "mcp_load_failed"`) and use fetch-prices.py -- contract additive (the failures entry IS the degrade signal). `source` always shows the actual path. NEVER HALT on MCP absence; NEVER skip Tier 0 silently. Use `tools/lib/capability-detect.sh` when an explicit harness check is cheaper than a try/catch.

## Deterministic technicals panel (v5, flag-gated -- /invest only)

Fires ONLY when the parent's input carries `include_technicals: true` (/invest
E.0 and the Tier-A quote-technicals worker pass it; /brief and /networth omit it
and get byte-identical v4 behavior -- no historicals call, no `technicals` key).

1. Load `mcp__robinhood-trading__get_equity_historicals` via ToolSearch (same
   Step-1 assert discipline; load failure -> `failures[]` entry
   `reason: "historicals_load_failed"` + `technicals: null`, never silent).
2. ONE batched call (<=10 symbols): the target + SPY benchmark + any
   `correlation_basket` symbols the parent passed. Request ~420 calendar days of
   daily bars (SMA200 / 12-1 momentum / 52wk need ~252 sessions).
3. Write the raw tool JSON VERBATIM to the session scratchpad dir (Bash
   redirection; NEVER a vault path -- this is the sanctioned carve-out to the
   read-only rule: scratchpad only, vault never).
4. Run `python /path/to/vault/tools/technicals.py --file <bars.json> --ticker <T>
   --benchmark SPY` and, when a basket was passed,
   `--matrix <T>,<basket...>`. Stdlib-only; self-tested (tools/test-technicals.py).
5. Return the panel verbatim under a top-level `technicals` key (additive) with
   `technicals_prov: "script:technicals"` + the `--matrix` result under
   `correlation_matrix` when computed. The panel's `returns_pct["5_session"]` is
   the sanctioned prov source for the GATE-F `move_5d_pct` marker.

Degradation ladder: MCP historicals + technicals.py [preferred] -> Tier-1
fetch-prices.py subset (rsi14/ma50/ma200/beta already merged on quotes) with
`technicals: null` + failures[] entry -> parent's Phase G WebSearch (Grade-C,
disclosed). A missing panel NEVER blocks the quote return.

## Parent-gate contract (v4)

During `market_session == regular`, for every HELD equity in the parent's input list:
- This agent must return `source = "robinhood-mcp (live)"` AND `broker_authoritative = true` on that quote.
- The parent asserts `mcp_price_count >= <count of held equities requested>`.
- On assertion failure the parent re-dispatches this agent ONCE; on second failure the parent HALTs its portfolio-math phase and surfaces the failure -- it must NOT proceed with non-broker prices for regular-session portfolio operations (cap C5: a web/non-broker portfolio price in regular session caps consuming-skill confidence at 60 + flag).
- The gate is N/A when the broker MCP is structurally absent from the session tool surface (non-Codex harness, headless run, or MCP not connected): the Step-1 failures[] entry documents the degrade and the parent applies cap C5 instead of HALTing.

**Scope:** Tier 0 is EQUITIES ONLY. Crypto tickers skip Tier 0 (MCP cannot quote crypto) -> fetch-prices.py. Do NOT call get_portfolio here -- account totals/positions are the consuming skill's job (e.g. /networth Phase 1.0).

